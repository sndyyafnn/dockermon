services:
  docker-monitor:
    build: .
    image: docker-monitor:latest
    container_name: docker-monitor
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - PORT=3100
      - POLL_INTERVAL_MS=2000
      - ADMIN_USER=admin
      - ADMIN_PASS=admin
    volumes:
      # Required: lets the app talk to the Docker daemon to list containers,
      # read stats, stream events, and manage container lifecycle for Admin.
      - /var/run/docker.sock:/var/run/docker.sock


      # Optional: uncomment the two lines below for more accurate HOST-level
      # CPU / RAM / disk numbers in the "System Resources" panel (otherwise
      # those numbers reflect the container's own cgroup view).
      # - /proc:/host/proc:ro
      # - /sys:/host/sys:ro
    # Optional: needed alongside the /proc,/sys mounts above for fully
    # accurate host metrics via the systeminformation library.
    # pid: host
