<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUTHENTICATION // DOCKERMON TELEMETRY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body.login-body-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #000000;
      padding: 20px;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      background: #09090b;
      border: 1px solid #1c1c24;
      border-radius: 8px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }
    .login-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .login-title {
      font-family: "Orbitron", sans-serif;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f4f4f5;
    }
    .login-sub {
      font-family: "Space Mono", monospace;
      font-size: 11px;
      color: #71717a;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-family: "Space Mono", monospace;
      font-size: 11px;
      font-weight: 700;
      color: #a1a1aa;
    }
    .form-input {
      background: #121216;
      border: 1px solid #272732;
      border-radius: 4px;
      padding: 10px 14px;
      color: #f4f4f5;
      font-family: "Space Mono", monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .form-input:focus {
      border-color: #ff6b00;
    }
    .form-error {
      font-family: "Space Mono", monospace;
      font-size: 11px;
      color: #ff3b30;
      background: rgba(255, 59, 48, 0.1);
      border: 1px solid #ff3b30;
      border-radius: 4px;
      padding: 8px 12px;
    }
    .login-submit-btn {
      font-family: "Space Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      padding: 12px;
      background: #ff6b00;
      color: #000000;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: 1.5px;
      transition: opacity 0.15s ease;
    }
    .login-submit-btn:hover {
      opacity: 0.9;
    }
    .login-submit-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .guest-hint {
      font-family: "Space Mono", monospace;
      font-size: 11px;
      color: #52525b;
      border-top: 1px solid #1c1c24;
      padding-top: 14px;
      text-align: center;
    }
    .guest-link {
      color: #10b981;
      text-decoration: underline;
    }
  </style>
</head>
<body class="login-body-wrapper">

  <div class="login-container">
    <div class="login-header">
      <h1 class="login-title">DOCKERMON ACCESS</h1>
      <div class="login-sub">[ ADMIN AUTHENTICATION GATEWAY ]</div>
    </div>

    <form id="login-form" autocomplete="off" novalidate style="display: flex; flex-direction: column; gap: 16px;">
      <div class="form-group">
        <label for="username" class="form-label">USER IDENTIFIER</label>
        <input type="text" id="username" name="username" class="form-input" placeholder="admin" autocomplete="off" spellcheck="false" autofocus />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">SECRET KEY</label>
        <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="off" spellcheck="false" />
      </div>

      <div class="form-error" id="login-error" hidden>
        <span id="error-text"></span>
      </div>

      <button type="submit" id="login-btn" class="login-submit-btn">AUTHENTICATE</button>
    </form>

    <div class="guest-hint">
      Public read-only view available at <a href="/guest" class="guest-link">/guest</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const errorTextEl = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('Username and password required');
        return;
      }

      loginBtn.textContent = 'AUTHENTICATING...';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          window.location.href = '/';
        } else {
          showError(data.error || 'Invalid credentials');
          loginBtn.textContent = 'AUTHENTICATE';
          loginBtn.disabled = false;
        }
      } catch (err) {
        showError('Connection error: ' + err.message);
        loginBtn.textContent = 'AUTHENTICATE';
        loginBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorTextEl.textContent = msg;
      errorEl.hidden = false;
      errorEl.classList.remove('hidden');
    }
  </script>
</body>
</html>
