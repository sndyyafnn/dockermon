<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOCKER DASHBOARD — LOGIN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="crt login-crt">
    <header class="topbar">
      <div class="tabs">
        <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        <span class="tab">Login</span>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock"></span>
      </div>
    </header>

    <div class="login-body">
      <div class="titlebar">DOCKER DASHBOARD <span id="version">v1.0.0</span></div>

      <div class="login-prompt">
        <span class="prompt-label">root@auth-gateway-01:~#</span>
        <span class="prompt-text">access /admin/* requires authentication</span>
      </div>

      <form id="login-form" class="login-form" autocomplete="off" novalidate>
        <div class="form-row">
          <label for="username" class="form-label">USER</label>
          <input type="text" id="username" name="username" class="form-input" placeholder="admin" autocomplete="off" spellcheck="false" autofocus />
        </div>
        <div class="form-row">
          <label for="password" class="form-label">PASS</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" autocomplete="off" spellcheck="false" />
        </div>
        <div class="form-error" id="login-error" hidden>
          <span class="error-marker">✖</span> <span id="error-text"></span>
        </div>
        <button type="submit" id="login-btn" class="login-btn">LOGIN</button>
      </form>

      <div class="login-hint">
        <span class="hint-label">hint:</span>
        <span class="hint-text">guest read-only access: <code class="hint-code">?guest=&lt;token&gt;</code> on the dashboard URL</span>
      </div>
    </div>

    <footer class="statusbar">
      <span>[Press Enter to login | <span id="poll-rate">2s</span> update]</span>
      <span class="prompt">root@auth-gateway-01:~# <span class="cursor">_</span></span>
    </footer>
  </div>

  <script>
    function tickClock() {
      const now = new Date();
      const el = document.getElementById('clock');
      if (el) el.textContent = now.toLocaleTimeString('en-GB', { hour12: false });
    }
    setInterval(tickClock, 1000);
    tickClock();

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('login-error');
    const errorTextEl = document.getElementById('error-text');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showError('username and password required');
        return;
      }

      loginBtn.textContent = 'SUBMITTING';
      loginBtn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await res.json();

        if (res.ok && data.ok) {
          window.location.href = '/';
        } else {
          showError(data.error || 'login failed');
          loginBtn.textContent = 'LOGIN';
          loginBtn.disabled = false;
        }
      } catch (err) {
        showError('connection error: ' + err.message);
        loginBtn.textContent = 'LOGIN';
        loginBtn.disabled = false;
      }
    });

    function showError(msg) {
      errorTextEl.textContent = msg;
      errorEl.hidden = false;
      errorEl.classList.remove('hidden');
    }
  </script>
</body>
</html>
